<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presentación Ejecutiva: Proyecto Innovación</title>
    <link rel="stylesheet" href="design.css">
</head>
<body>

    <div id="progress-bar"></div>

    <div id="agenda-tracker">
        <div class="agenda-item" id="agenda-item-1">1. Contexto</div>
        <div class="agenda-item" id="agenda-item-2">2. Estado Actual</div>
        <div class="agenda-item" id="agenda-item-3">3. Análisis y Sinergias</div>
        <div class="agenda-item" id="agenda-item-4">4. Aprendizajes</div>
        <div class="agenda-item" id="agenda-item-5">5. Próximos Pasos</div>
    </div>

    <div class="presentation-container" id="slides-container"></div>

    <nav class="nav-controls">
        <button id="prev-slide" aria-label="Diapositiva anterior">&larr;</button>
        <button id="next-slide" aria-label="Siguiente diapositiva">&rarr;</button>
    </nav>

    <script type="module" src="main.js"></script>
</body>
</html>
