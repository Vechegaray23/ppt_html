<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comité innovación – Visor de diapositivas</title>
    <style>
        :root {
            color-scheme: light dark;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f4f6fb;
            color: #0b2545;
            min-height: 100vh;
        }

        h1, h2, h3 {
            font-weight: 600;
        }

        .viewer {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        #slide-frame {
            flex: 1 1 auto;
            width: 100%;
            border: none;
            background: #ffffff;
        }

        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            padding: 1rem;
            background: #ffffff;
            box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.08);
            position: sticky;
            bottom: 0;
        }

        button {
            appearance: none;
            border: none;
            border-radius: 999px;
            padding: 0.75rem 1.75rem;
            font-size: 1rem;
            font-weight: 600;
            background: #4f1fff;
            color: #ffffff;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
        }

        button:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 10px 20px rgba(79, 31, 255, 0.18);
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.45;
            box-shadow: none;
        }

        .status {
            font-variant-numeric: tabular-nums;
            font-size: 0.95rem;
            letter-spacing: 0.02em;
            color: #344e9a;
            min-width: 5rem;
            text-align: center;
        }

        @media (max-width: 768px) {
            .controls {
                flex-wrap: wrap;
                gap: 0.75rem;
            }

            button {
                width: 100%;
                max-width: 180px;
            }

            .status {
                order: -1;
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="viewer">
        <iframe id="slide-frame" title="Presentación Comité innovación" src="slide-1.html" loading="lazy"></iframe>
        <div class="controls">
            <button id="prev-slide" type="button">Anterior</button>
            <span class="status" id="slide-status">1 / 8</span>
            <button id="next-slide" type="button">Siguiente</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const totalSlides = 8;
            let currentSlide = 1;

            const frame = document.getElementById('slide-frame');
            const prevButton = document.getElementById('prev-slide');
            const nextButton = document.getElementById('next-slide');
            const status = document.getElementById('slide-status');

            function updateControls() {
                status.textContent = `${currentSlide} / ${totalSlides}`;
                prevButton.disabled = currentSlide <= 1;
                nextButton.disabled = currentSlide >= totalSlides;
            }

            function setHash(slideNumber) {
                const hash = `#${slideNumber}`;
                if (window.location.hash !== hash) {
                    history.replaceState(null, '', hash);
                }
            }

            function goToSlide(slideNumber, { updateHash = true } = {}) {
                if (Number.isNaN(slideNumber) || slideNumber < 1 || slideNumber > totalSlides) {
                    return;
                }

                currentSlide = slideNumber;
                const target = `slide-${slideNumber}.html`;
                if (frame.getAttribute('src') !== target) {
                    frame.setAttribute('src', target);
                }

                if (updateHash) {
                    setHash(slideNumber);
                }

                updateControls();
            }

            function handleHashChange() {
                const hashValue = window.location.hash.replace('#', '');
                const parsed = parseInt(hashValue, 10);
                if (!Number.isNaN(parsed) && parsed >= 1 && parsed <= totalSlides && parsed !== currentSlide) {
                    goToSlide(parsed, { updateHash: false });
                }
            }

            prevButton.addEventListener('click', () => goToSlide(currentSlide - 1));
            nextButton.addEventListener('click', () => goToSlide(currentSlide + 1));

            document.addEventListener('keydown', (event) => {
                if (['ArrowRight', 'PageDown', ' '].includes(event.key)) {
                    event.preventDefault();
                    goToSlide(currentSlide + 1);
                }

                if (['ArrowLeft', 'PageUp'].includes(event.key)) {
                    event.preventDefault();
                    goToSlide(currentSlide - 1);
                }
            });

            window.addEventListener('hashchange', handleHashChange);

            const initialHash = parseInt(window.location.hash.replace('#', ''), 10);
            if (!Number.isNaN(initialHash) && initialHash >= 1 && initialHash <= totalSlides) {
                currentSlide = initialHash;
                frame.setAttribute('src', `slide-${currentSlide}.html`);
            }

            goToSlide(currentSlide, { updateHash: false });
        });
    </script>
</body>
</html>
