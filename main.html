<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presentación Ejecutiva: Proyecto Innovación</title>
    <link rel="stylesheet" href="design.css">
</head>
<body>

    <div id="progress-bar"></div>

    <div id="agenda-tracker">
        <div class="agenda-item" id="agenda-item-1">1. Contexto</div>
        <div class="agenda-item" id="agenda-item-2">2. Estado Actual</div>
        <div class="agenda-item" id="agenda-item-3">3. Análisis y Sinergias</div>
        <div class="agenda-item" id="agenda-item-4">4. Aprendizajes</div>
        <div class="agenda-item" id="agenda-item-5">5. Próximos Pasos</div>
    </div>

    <div class="presentation-container" id="slides-container"></div>

    <nav class="nav-controls">
        <button id="prev-slide" aria-label="Diapositiva anterior">&larr;</button>
        <button id="next-slide" aria-label="Siguiente diapositiva">&rarr;</button>
    </nav>

    <script>
        const slideFiles = [
            'slides/slide01.html',
            'slides/slide02.html',
            'slides/slide03.html',
            'slides/slide04.html',
            'slides/slide05.html',
            'slides/slide06.html',
            'slides/slide07.html',
            'slides/slide08.html',
            'slides/slide09.html',
            'slides/slide10.html'
        ];

        function loadSlides() {
            const container = document.getElementById('slides-container');

            Promise.all(slideFiles.map(file => fetch(file).then(response => {
                if (!response.ok) {
                    throw new Error(`No se pudo cargar ${file}: ${response.status}`);
                }
                return response.text();
            })))
                .then(contents => {
                    container.innerHTML = contents.join('\n');
                    initializePresentation();
                })
                .catch(error => {
                    console.error('Error al cargar las diapositivas:', error);
                    container.innerHTML = '<p style="padding: 2rem; font-size: 1.25rem; text-align: center;">No se pudieron cargar las diapositivas. Intenta recargar la página.</p>';
                });
        }

        function initializePresentation() {
            const slides = document.querySelectorAll('.slide');
            if (!slides.length) {
                return;
            }

            const prevButton = document.getElementById('prev-slide');
            const nextButton = document.getElementById('next-slide');
            const progressBar = document.getElementById('progress-bar');
            const agendaTracker = document.getElementById('agenda-tracker');
            const agendaItems = document.querySelectorAll('.agenda-item');

            let currentSlide = 0;
            const totalSlides = slides.length;

            function showSlide(index) {
                slides[currentSlide].classList.remove('active');

                if (index >= totalSlides) {
                    currentSlide = totalSlides - 1;
                } else if (index < 0) {
                    currentSlide = 0;
                } else {
                    currentSlide = index;
                }

                const activeSlide = slides[currentSlide];
                activeSlide.classList.add('active');
                updateProgress();
                updateAgendaTracker(activeSlide);
            }

            function updateProgress() {
                const denominator = totalSlides > 1 ? totalSlides - 1 : 1;
                const progressPercentage = (currentSlide / denominator) * 100;
                progressBar.style.width = `${progressPercentage}%`;
            }

            function updateAgendaTracker(activeSlide) {
                const agendaIndex = activeSlide.getAttribute('data-agenda-item');

                agendaItems.forEach(item => item.classList.remove('active'));

                if (agendaIndex && agendaIndex !== '0') {
                    agendaTracker.style.visibility = 'visible';
                    agendaTracker.style.opacity = '1';

                    const trackerItem = document.getElementById(`agenda-item-${agendaIndex}`);
                    if (trackerItem) {
                        trackerItem.classList.add('active');
                    }
                } else {
                    agendaTracker.style.visibility = 'hidden';
                    agendaTracker.style.opacity = '0';
                }
            }

            function nextSlide() {
                if (currentSlide < totalSlides - 1) {
                    showSlide(currentSlide + 1);
                }
            }

            function prevSlide() {
                if (currentSlide > 0) {
                    showSlide(currentSlide - 1);
                }
            }

            nextButton.addEventListener('click', nextSlide);
            prevButton.addEventListener('click', prevSlide);

            document.addEventListener('keydown', event => {
                if (event.key === 'ArrowRight' || event.key === 'PageDown' || event.key === ' ') {
                    nextSlide();
                } else if (event.key === 'ArrowLeft' || event.key === 'PageUp') {
                    prevSlide();
                }
            });

            slides[currentSlide].classList.add('active');
            updateProgress();
            updateAgendaTracker(slides[currentSlide]);
        }

        document.addEventListener('DOMContentLoaded', loadSlides);
    </script>
</body>
</html>
